name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: pnpmをセットアップ
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: フォーマット
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: 型チェック
        run: pnpm typecheck
      - name: テスト
        run: pnpm test
      - name: ビルド
        run: pnpm build
